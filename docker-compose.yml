services:
  binancebot:
    image: binancebot:latest
    container_name: binancebot
    restart: unless-stopped
    environment:
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_SECRET_KEY=${BINANCE_SECRET_KEY}
      - BINANCE_TESTNET=${BINANCE_TESTNET:-false}
      - FORCE_BUY=${FORCE_BUY:-false}
      - FORCE_SELL=${FORCE_SELL:-false}
      - SYMBOLS=${SYMBOLS:-BTCUSDT,ETHUSDT,BNBUSDT,XRPUSDT,DOGEUSDT,LTCUSDT}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - TIMEFRAME=${TIMEFRAME:-15m}
      - MIN_BALANCE_USDT=${MIN_BALANCE_USDT:-100}
      - LEVERAGE=${LEVERAGE:-5}
      - MARGIN_PER_TRADE_USDT=${MARGIN_PER_TRADE_USDT:-100}
      - SLEEP_MINUTES=${SLEEP_MINUTES:-15}
    volumes:
      # Mount logs directory if you want to persist logs
      - ./logs:/app/logs
    # Uncomment below if you need to expose any ports
    # ports:
    #   - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "print('Bot is running')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"
